services:
  - type: web
    name: block-bulk-deals-tracker
    runtime: python
    plan: free
    # Closest region to India. NSE and BSE are likelier to answer a nearby
    # address, and the round trip on every fetch is much shorter.
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # NSE live quotes are blocked from cloud IPs; go straight to BSE LTP.
      - key: SKIP_NSE_LIVE
        value: "true"
      - key: REQUEST_TIMEOUT
        value: "25"
